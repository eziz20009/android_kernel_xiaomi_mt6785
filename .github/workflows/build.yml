name: Build NetHunter Kernel for Poco M5s (rosemary)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Установка базовых утилит
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison flex libssl-dev libelf-dev git zip curl python3

    - name: Клонирование исходного кода ядра
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 1

    - name: Скачивание официального компилятора Google Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        curl -LO https://android.googlesource.com/toolchain/clang
        tar -xf clang-r487747c.tar.gz

    - name: Конфигурация драйверов NetHunter
      run: |
        cp arch/arm64/configs/rosemary_defconfig .config
        cat <<EOF >> .config
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_CFG80211_WEXT=y
        CONFIG_MAC80211_MESH=y
        CONFIG_WLAN_VENDOR_ATH=y
        CONFIG_WLAN_VENDOR_REALTEK=y
        CONFIG_WLAN_VENDOR_RALINK=y
        CONFIG_ATH_CARDS=y
        CONFIG_ATH9K_HW=y
        CONFIG_ATH9K_COMMON=y
        CONFIG_ATH9K_HTC=y
        CONFIG_RT2X00=m
        CONFIG_RT2800USB=m
        CONFIG_RTL8187=m
        CONFIG_RTL_CARDS=m
        CONFIG_RTL192CU=m
        CONFIG_RTL8XXXU=m
        CONFIG_USB_NET_DRIVERS=y
        CONFIG_USB_RTL8152=m
        CONFIG_USB_USBNET=y
        CONFIG_USB_NET_CDCETHER=y
        CONFIG_USB_NET_RNDIS_HOST=y
        EOF

    - name: Компиляция ядра через Google Clang
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        make rosemary_defconfig
        make -j$(nproc) ARCH=arm64 CC=clang LD=ld.lld Image.gz-dtb

    - name: Подготовка прошиваемого AnyKernel3 ZIP-архива
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 updater
        rm -rf updater/.git
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          cp arch/arm64/boot/Image.gz-dtb updater/Image.gz-dtb
        else
          cp arch/arm64/boot/Image updater/Image
        fi
        sed -i 's/device.name1=/device.name1=rosemary/g' updater/anykernel.sh
        cd updater
        zip -r3 ../NetHunter-Kernel-Poco-M5s-Flashable.zip *

    - name: Сохранение готового архива для прошивки
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Poco-M5s-Flashable
        path: NetHunter-Kernel-Poco-M5s-Flashable.zip
        
